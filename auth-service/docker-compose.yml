version: '3.9'

services:

  postgres:
    image: postgres:16

    container_name: auth-postgres

    restart: unless-stopped

    env_file:
      - localDocker.env

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  auth-service:

    build: .

    env_file:
      - localDocker.env
    container_name: auth-service

    depends_on:
      - postgres

    ports:
      - "8080:8080"

volumes:
  postgres-data:
